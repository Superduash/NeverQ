services:
  # Fallback topology: Backend API & WebSockets on Render (Frontend on Vercel)
  - type: web
    name: neverq-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
