services:
  # Primary topology: Single Render web service serving built frontend, API, and WebSockets (NeverQ2 §8, §2.1)
  - type: web
    name: neverq
    env: node
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
