<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NeverQ — Hospital Wait Times & Live Queue</title>
    <meta name="description" content="See real-time hospital wait times on an interactive map and join queues remotely without login." />
    
    <!-- Theme color per media query -->
    <meta name="theme-color" content="#0077b6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#00111c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA & Mobile Web App meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NeverQ" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Blocking theme resolution to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem("nq-theme");
          var isDark = stored === "dark";
          var active = isDark ? "dark" : "light";
          root.setAttribute("data-theme", active);
          root.style.colorScheme = active;
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", isDark ? "#00111c" : "#0077b6");
            metas[i].removeAttribute("media");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (headings) and Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>NeverQ requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
