<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NeverQ — Offline</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root {
        --bg: #f4fbff;
        --surface: #ffffff;
        --border: rgba(0, 119, 182, 0.16);
        --ink: #03045e;
        --ink-muted: #023e8a;
        --brand: #0077b6;
        --brand-2: #00b4d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #00111c;
          --surface: #001a2c;
          --border: #003356;
          --ink: #f0f9ff;
          --ink-muted: #bae6fd;
          --brand: #0096c7;
          --brand-2: #00b4d8;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      }
      body {
        background-color: var(--bg);
        color: var(--ink);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 12px 32px -8px rgba(0, 119, 182, 0.18);
      }
      .logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto 20px auto;
        display: block;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        color: var(--ink-muted);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 20px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 14px;
        cursor: pointer;
        border: none;
        text-decoration: none;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        color: #ffffff;
        margin-bottom: 10px;
      }
      .btn-secondary {
        background: transparent;
        color: var(--brand);
        border: 1px solid var(--border);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 16px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="NeverQ" class="logo-icon" />
      <div class="status">
        <span class="status-dot"></span> Offline Mode
      </div>
      <h1>Connection Unavailable</h1>
      <p>
        NeverQ is currently offline. You can still view your previously cached queue tickets or reconnect when your internet restores.
      </p>
      <button class="btn btn-primary" onclick="window.location.reload()">
        Retry Connection
      </button>
      <button class="btn btn-secondary" onclick="goToCachedTicket()">
        View Last Ticket
      </button>
    </div>

    <script>
      function goToCachedTicket() {
        try {
          var active = localStorage.getItem("nq-active-ticket");
          if (active) {
            var parsed = JSON.parse(active);
            if (parsed && parsed.token) {
              window.location.href = "/t/" + parsed.token;
              return;
            }
          }
        } catch (e) {}
        window.location.href = "/";
      }

      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
